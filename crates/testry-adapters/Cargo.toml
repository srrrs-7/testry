[package]
name = "testry-adapters"
description = "Adapters of testry: Git, Oxc, runners, processes, containers, storage, report formats."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
testry-application = { workspace = true }
testry-domain = { workspace = true }
blake3 = { workspace = true }
nix = { workspace = true }
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_parser = { workspace = true }
oxc_resolver = { workspace = true }
oxc_span = { workspace = true }
quick-xml = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "rt", "io-util", "macros", "fs", "time", "sync"] }

[dev-dependencies]
testry-application = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
