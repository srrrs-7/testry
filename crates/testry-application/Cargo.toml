[package]
name = "testry-application"
description = "Use cases, IO ports, planning, scheduling and result aggregation of testry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# In-memory fakes of the ports and settings builders, for tests in this and
# other crates. Never enabled by the testry binary (checked by the
# architecture test).
test-support = []

[dependencies]
testry-domain = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Enables the fakes for this crate's own integration tests.
testry-application = { path = ".", features = ["test-support"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }

[lints]
workspace = true
