[package]
name = "testry-cli"
description = "The testry command line: arguments, configuration loading, composition root, output, exit codes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "testry"
path = "src/main.rs"

[dependencies]
testry-adapters = { workspace = true }
testry-application = { workspace = true }
testry-domain = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "sync", "macros"] }
toml = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
